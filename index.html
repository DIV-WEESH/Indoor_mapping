<!DOCTYPE html>
<html>
<head>
    <title>Indoor Navigation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 30px;
        }
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        button.secondary {
            background: #95a5a6;
        }
        button.secondary:hover {
            background: #7f8c8d;
        }
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .landmark-grid, .room-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 20px 0;
            max-height: 400px;
            overflow-y: auto;
        }
        .landmark-card, .room-card {
            padding: 20px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .landmark-card:hover, .room-card:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: scale(1.05);
        }
        .icon {
            font-size: 30px;
            margin-bottom: 10px;
        }
        .route-step {
            background: #f8f9fa;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .route-step strong {
            color: #667eea;
        }
        .total-distance {
            background: #667eea;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
            font-size: 20px;
            font-weight: bold;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .empty-state-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        .step-number {
            display: inline-block;
            background: #667eea;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            margin-right: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ Indoor Navigation</h1>
        <p class="subtitle">Find your way around easily</p>
        
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h2>Where are you?</h2>
            <button onclick="showLandmarks()">📍 Select Your Location</button>
        </div>

        <!-- Landmark Selection Screen -->
        <div id="landmark-screen" class="screen">
            <h2>Select Your Current Location</h2>
            <div id="landmark-list" class="landmark-grid"></div>
            <button class="secondary" onclick="showStart()">← Back</button>
        </div>

        <!-- Destination Screen -->
        <div id="destination-screen" class="screen">
            <h2>Where do you want to go?</h2>
            <input type="text" id="search" placeholder="🔍 Search for a room..." oninput="filterRooms()">
            <div id="room-list" class="room-grid"></div>
            <button class="secondary" onclick="showLandmarks()">← Back</button>
        </div>

        <!-- Navigation Screen -->
        <div id="navigation-screen" class="screen">
            <h2>Your Route</h2>
            <div id="route-info"></div>
            <button class="secondary" onclick="showDestinations()">← Choose Another</button>
            <button onclick="showStart()">🏠 Start Over</button>
        </div>
    </div>

    <script>
        let nodes = [];
        let edges = [];
        let currentLocation = null;

        // Load data
        window.onload = function() {
            loadData();
        };

        function loadData() {
            nodes = JSON.parse(localStorage.getItem('nodes') || '[]');
            edges = JSON.parse(localStorage.getItem('edges') || '[]');
            
            if (nodes.length === 0) {
                document.querySelector('.subtitle').textContent = 
                    '⚠️ No data found. Please set up the floor plan in the admin editor first.';
            }
        }

        // Screen navigation
        function showStart() {
            hideAllScreens();
            document.getElementById('start-screen').classList.add('active');
            currentLocation = null;
        }

        function showLandmarks() {
            hideAllScreens();
            document.getElementById('landmark-screen').classList.add('active');
            renderLandmarks();
        }

        function showDestinations() {
            if (!currentLocation) {
                alert('Please select your current location first!');
                showLandmarks();
                return;
            }
            hideAllScreens();
            document.getElementById('destination-screen').classList.add('active');
            renderRooms();
        }

        function showNavigation(destination) {
            hideAllScreens();
            document.getElementById('navigation-screen').classList.add('active');
            calculateAndShowRoute(destination);
        }

        function hideAllScreens() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        }

        // Render landmarks
        function renderLandmarks() {
            const container = document.getElementById('landmark-list');
            const landmarks = nodes.filter(n => n.type === 'landmark' || n.type === 'hallway');
            
            if (landmarks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">📍</div>
                        <p>No landmarks available</p>
                    </div>
                `;
                return;
            }

            const icons = {
                'landmark': '📍',
                'hallway': '🚶',
                'stairs': '🪜',
                'elevator': '🛗'
            };

            container.innerHTML = landmarks.map(node => `
                <div class="landmark-card" onclick="selectLocation('${node.id}')">
                    <div class="icon">${icons[node.type] || '📍'}</div>
                    <strong>${node.name}</strong>
                    <div style="font-size: 12px; margin-top: 5px; color: #666;">Floor ${node.floor}</div>
                </div>
            `).join('');
        }

        // Render rooms
        function renderRooms(filter = '') {
            const container = document.getElementById('room-list');
            let rooms = nodes.filter(n => currentLocation.id !== n.id);
            
            if (filter) {
                rooms = rooms.filter(n => 
                    n.name.toLowerCase().includes(filter.toLowerCase())
                );
            }

            if (rooms.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">🚪</div>
                        <p>No rooms found</p>
                    </div>
                `;
                return;
            }

            const icons = {
                'room': '🚪',
                'landmark': '📍',
                'hallway': '🚶',
                'stairs': '🪜',
                'elevator': '🛗'
            };

            container.innerHTML = rooms.map(node => `
                <div class="room-card" onclick="showNavigation('${node.id}')">
                    <div class="icon">${icons[node.type] || '🚪'}</div>
                    <strong>${node.name}</strong>
                    <div style="font-size: 12px; margin-top: 5px; color: #666;">Floor ${node.floor}</div>
                </div>
            `).join('');
        }

        function filterRooms() {
            const filter = document.getElementById('search').value;
            renderRooms(filter);
        }

        function selectLocation(nodeId) {
            currentLocation = nodes.find(n => n.id === nodeId);
            showDestinations();
        }

        // Dijkstra's algorithm for pathfinding
        function findShortestPath(startId, endId) {
            const distances = {};
            const previous = {};
            const unvisited = new Set();

            nodes.forEach(node => {
                distances[node.id] = Infinity;
                previous[node.id] = null;
                unvisited.add(node.id);
            });

            distances[startId] = 0;

            while (unvisited.size > 0) {
                let currentId = null;
                let minDist = Infinity;
                
                for (let id of unvisited) {
                    if (distances[id] < minDist) {
                        minDist = distances[id];
                        currentId = id;
                    }
                }

                if (currentId === null || distances[currentId] === Infinity) break;
                if (currentId === endId) break;

                unvisited.delete(currentId);

                const neighbors = edges.filter(e => 
                    e.from === currentId || e.to === currentId
                );

                neighbors.forEach(edge => {
                    const neighborId = edge.from === currentId ? edge.to : edge.from;
                    if (!unvisited.has(neighborId)) return;

                    const alt = distances[currentId] + edge.distance;
                    if (alt < distances[neighborId]) {
                        distances[neighborId] = alt;
                        previous[neighborId] = currentId;
                    }
                });
            }

            if (distances[endId] === Infinity) return null;

            const path = [];
            let current = endId;
            while (current !== null) {
                path.unshift(current);
                current = previous[current];
            }

            return { path, distance: distances[endId] };
        }

        function calculateAndShowRoute(destinationId) {
            const result = findShortestPath(currentLocation.id, destinationId);
            const container = document.getElementById('route-info');

            if (!result) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <p>No route found between these locations</p>
                    </div>
                `;
                return;
            }

            const destination = nodes.find(n => n.id === destinationId);
            
            let html = `
                <div class="total-distance">
                    📏 Total Distance: ${result.distance} meters
                </div>
                <p style="text-align: center; margin-bottom: 20px; color: #666;">
                    From <strong>${currentLocation.name}</strong> to <strong>${destination.name}</strong>
                </p>
            `;

            for (let i = 0; i < result.path.length - 1; i++) {
                const fromNode = nodes.find(n => n.id === result.path[i]);
                const toNode = nodes.find(n => n.id === result.path[i + 1]);
                const edge = edges.find(e => 
                    (e.from === fromNode.id && e.to === toNode.id) ||
                    (e.to === fromNode.id && e.from === toNode.id)
                );

                const icons = {
                    'room': '🚪',
                    'landmark': '📍',
                    'hallway': '🚶',
                    'stairs': '🪜',
                    'elevator': '🛗'
                };

                html += `
                    <div class="route-step">
                        <span class="step-number">${i + 1}</span>
                        <strong>Go to ${icons[toNode.type] || ''} ${toNode.name}</strong>
                        <div style="margin-top: 5px; font-size: 14px; color: #666;">
                            ${edge.distance} meters • Floor ${toNode.floor}
                        </div>
                    </div>
                `;
            }

            html += `
                <div class="route-step" style="background: #d4edda; border-color: #28a745;">
                    <span class="step-number" style="background: #28a745;">✓</span>
                    <strong>You've arrived!</strong>
                </div>
            `;

            container.innerHTML = html;
        }
    </script>
</body>
</html>
